services:

  # ----------------------------
  # MYSQL (OLTP sources)
  # ----------------------------
  mysql-node-7:
    image: mysql:8
    container_name: mysql-node-71
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: grocerydb
    ports:
      - "3309:3306"
    volumes:
      - ./sql-scripts/mysql_schema.sql:/docker-entrypoint-initdb.d/01_mysql_schema.sql

  mysql-node-8:
    image: mysql:8
    container_name: mysql-node-81
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: grocerydb
    ports:
      - "3310:3306"
    volumes:
      - ./sql-scripts/mysql_schema.sql:/docker-entrypoint-initdb.d/01_mysql_schema.sql

  # ----------------------------
  # MONGODB (NoSQL layer)
  # ----------------------------
  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-scripts/init_mongo.js:/docker-entrypoint-initdb.d/init_mongo.js:ro
      - ./mongo-scripts/mongo_seed.json:/docker-entrypoint-initdb.d/mongo_seed.json:ro

  # ----------------------------
  # POSTGRES (Data Warehouse)
  # ----------------------------
  postgres:
    image: postgres:15
    container_name: postgres-dw
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"

  # Hadoop NameNode
  namenode:
    image: apache/hadoop:3.3.6
    container_name: namenode
    environment:
      - CLUSTER_NAME=demo
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - namenode-data:/hadoop/dfs/name

  # Hadoop DataNode
  datanode:
    image: apache/hadoop:3.3.6
    container_name: datanode
    environment:
      - SERVICE_PRECONDITION=namenode:8020
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    ports:
      - "9864:9864"
    depends_on:
      - namenode
    volumes:
      - datanode-data:/hadoop/dfs/data

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    depends_on:
      - postgres

# ----------------------------
# VOLUMES (databases only)
# ----------------------------
volumes:
  mysql7-data:
  mysql8-data:
  mongo-data:
  postgres-data:
  namenode-data:
  datanode-data: